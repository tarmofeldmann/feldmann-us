<!DOCTYPE html>
<html lang="et"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FELDMANN.US — Pärnu arhiiv</title><style>:root{--bg:#0a0a0a;--paper:#f5f2ed;--muted:#9a9590;--line:#1c1c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font-family:Inter,system-ui,sans-serif}.serif{font-family:Georgia,serif}header{display:flex;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,10,10,.9);backdrop-filter:blur(12px);z-index:10}.hero{height:68vh;display:grid;place-items:end start;padding:40px 24px;background:radial-gradient(1200px 600px at 20% -10%,#2a2a2a,transparent),linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.8)),url('https://picsum.photos/seed/parnu/1600/900') center/cover}.hero h1{font-size:clamp(40px,7vw,84px);line-height:.9;letter-spacing:-2px;margin:0;max-width:700px}.grid{columns:3 300px;column-gap:16px;padding:16px 24px}.card{break-inside:avoid;margin-bottom:16px;border-radius:18px;overflow:hidden;background:#141414;border:1px solid var(--line)}.card .img{aspect-ratio:4/3;background-size:cover;background-position:center}.badge{font-size:11px;border:1px solid #2a2a2a;padding:3px 8px;border-radius:999px;color:var(--muted)}.meta{padding:14px 16px}h3{margin:8px 0 4px;font-size:20px}.small{color:var(--muted);font-size:13px}.panel{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;padding:20px;z-index:50}.panel.open{display:grid}.box{max-width:640px;width:100%;background:#f5f2ed;color:#111;border-radius:20px;padding:24px}.box input{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:12px;margin:8px 0 12px}.primary{background:#111;color:white;border:none;padding:12px 16px;border-radius:12px;cursor:pointer;width:100%}</style></head><body><header><div><b>FELDMANN.US</b></div><div><a href="#" onclick="document.getElementById('panel').classList.add('open');return false">Blogger → Arhiiv</a></div></header><div class="hero"><div><h1 class="serif">Pärnu, mida sa ei tea.</h1><p>Fotod, kaardid ja lood. Vana Blogger nüüd uues kuues.</p></div></div><div class="grid" id="grid"></div><div class="panel" id="panel"><div class="box"><h2>Ühenda Blogger</h2><p class="small">Sisesta blogi aadress, nt parnu-arhiiv.blogspot.com</p><input id="blogUrl" placeholder="blogspot.com aadress"><input id="apiKey" placeholder="API võti (valikuline)"><button class="primary" onclick="loadBlogger()">Lae postitused</button><div id="status" class="small"></div><br><button onclick="document.getElementById('panel').classList.remove('open')" class="small">Sulge</button></div></div><script>
const sample=[{t:"Ranna promenaad 1938",y:"1938",seed:"beach"},{t:"Karusselli tn maja",y:"1946",seed:"house"},{t:"Bloggerist Cloudflareni",y:"2026",seed:"cloud"},{t:"Pärnu lennuväli 1942",y:"1942",seed:"map"},{t:"20i sulgemine",y:"2026",seed:"server"},{t:"Endine bussijaam",y:"1978",seed:"bus"},{t:"Feldmannide sugupuu",y:"1920",seed:"family"},{t:"IT märkmed",y:"2024",seed:"notes"},{t:"Kirjad Pärnust",y:"1932",seed:"letter"}];
function render(list){const g=document.getElementById('grid');g.innerHTML='';list.forEach(p=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="img" style="background-image:url('https://picsum.photos/seed/${p.seed}/600/800')"></div><div class="meta"><span class="badge">${p.y}</span><h3 class="serif">${p.t}</h3><div class="small">${p.excerpt||'Ava →'}</div></div>`;if(p.url)d.onclick=()=>window.open(p.url,'_blank');g.appendChild(d);});}
render(sample);
async function loadBlogger(){const url=document.getElementById('blogUrl').value.trim().replace(/https?:\/\//,'').replace(/\/$/,'');const key=document.getElementById('apiKey').value.trim();const status=document.getElementById('status');status.textContent='Laen...';try{let posts=[];if(key){const br=await fetch(`https://www.googleapis.com/blogger/v3/blogs/byurl?url=https://${url}/&key=${key}`);const bj=await br.json();const pr=await fetch(`https://www.googleapis.com/blogger/v3/blogs/${bj.id}/posts?maxResults=20&key=${key}`);const pd=await pr.json();posts=(pd.items||[]).map(it=>({t:it.title,y:new Date(it.published).getFullYear(),seed:'b'+Math.random(),excerpt:it.content.replace(/<[^>]*>/g,'').slice(0,120),url:it.url}));}else{const feedUrl=`https://${url}/feeds/posts/default?alt=json&max-results=20`;const r=await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(feedUrl)}`);const j=await r.json();posts=(j.feed?.entry||[]).map(e=>({t:e.title.$t,y:new Date(e.published.$t).getFullYear(),seed:'b',excerpt:e.summary?e.summary.$t.slice(0,120):'',url:e.link.find(l=>l.rel==='alternate').href}));}window.all=[...posts,...sample];render(window.all);status.textContent=`Laetud ${posts.length} postitust!`;setTimeout(()=>document.getElementById('panel').classList.remove('open'),800);}catch(e){status.textContent='Viga: '+e.message;}}
</script></body></html>
