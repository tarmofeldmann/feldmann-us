<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarmo Feldmann foto — automaatne</title>
<style>
body{margin:0;font-family:Inter,system-ui;background:#fefefe;color:#111;transition:background 1s ease}
header{padding:32px;border-bottom:1px solid #eee}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:16px}
.card{border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);cursor:pointer;transform-origin:center}
.card img{width:100%;height:240px;object-fit:cover;display:block}
.card .cap{padding:12px;font-weight:600}
.big{grid-column:span 2;grid-row:span 2}
.wide{grid-column:span 2}
#status{padding:12px 32px;color:#888;font-size:14px}
</style>
</head>
<body>
<header>
<h1 id="mainTitle">Tarmo Feldmann foto</h1>
<div style="opacity:.6">PÄRNU FOTO PÄEVIK 2009 — 2026 · automaatne random · iga 6h uus</div>
</header>
<div id="status">Laen...</div>
<div id="grid" class="grid"></div>

<script>
const FEED = 'https://tarmo.feldmann.us/feeds/posts/default?alt=json&max-results=50';
const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?' + encodeURIComponent(u)
];
const COLORS = ["#ff006e","#ffbe0b","#fb5607","#8338ec","#3a86ff","#06ffa5","#ff00ff","#00ffff","#ffff00","#111","#ff0000","#00ff00"];
const FALLBACK = [
  {title:"Külmkapp unustas Pärnus", img:"https://images.unsplash.com/photo-1474487548417-781cb71495f3?q=80&w=800"},
  {title:"DNS ja takso tantsisid aidas", img:"https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?q=80&w=800"},
  {title:"Raeküla jaam 04:12", img:"https://images.unsplash.com/photo-1449824913935-59a10b8d2000?q=80&w=800"}
];

function juhu(a){return a[Math.floor(Math.random()*a.length)]}
function randomDesign(){
  const c=juhu(COLORS);
  document.body.style.background=c;
  document.body.style.color=(c=="#ffff00"||c=="#00ffff"||c=="#06ffa5"||c=="#ffbe0b")?"#000":"#fff";
}

async function tryFetch(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

async function load(){
  document.getElementById('status').textContent='Laen tarmo.feldmann.us/feeds...';
  let data=null;
  for(const p of PROXIES){
    try{ data=await tryFetch(p(FEED)); break; }catch(e){ console.log('proxy fail',e); }
  }
  // direct try as last
  if(!data){ try{ data=await tryFetch(FEED); }catch(e){} }

  let posts=[];
  if(data && data.feed && data.feed.entry){
    posts=data.feed.entry.map(e=>{
      const title=e.title.$t;
      const content=e.content?e.content.$t:'';
      const m=content.match(/<img[^>]+src="([^">]+)"/);
      const img=m?m[1]:juhu(FALLBACK).img;
      return {title, img};
    });
    document.getElementById('status').textContent=`Feed OK — ${posts.length} postitust`;
  }else{
    posts=FALLBACK;
    document.getElementById('status').textContent='Feed ei vastanud — näitan arhiivi (seosetu random)';
  }

  const grid=document.getElementById('grid');
  grid.innerHTML='';
  posts.forEach((p,i)=>{
    const art=document.createElement('article');
    art.className='card'+(i==0?' big':i==1?' wide':'');
    art.style.animationDelay=(i*40)+'ms';
    art.innerHTML=`<img src="${p.img}" loading="lazy" onerror="this.src='${FALLBACK[0].img}'"><div class="cap">${p.title}</div>`;
    // random rotate nagu seosetu jutt
    art.style.transform=`rotate(${(Math.random()-0.5)*4}deg)`;
    grid.appendChild(art);
  });
  // main title = viimane post
  if(posts[0]) document.getElementById('mainTitle').textContent=posts[0].title;
  randomDesign();
}

load();
setInterval(randomDesign, 8000);
setInterval(load, 1000*60*15); // iga 15min proovib uut feedi
</script>
</body>
</html>
